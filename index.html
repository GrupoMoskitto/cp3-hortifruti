<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Multimodal | Hortifruti</title>
  <link rel="stylesheet" href="src/css/estilo.css">
</head>
<body>
  <header class="topo">
    <h1>🍎 Hortifruti do João</h1>
    <p>Painel Multimodal: catálogo, busca e análise vetorial</p>
  </header>

   <main class="painel">
    <!-- Busca com guardrails -->
    <section class="card busca">
      <h2>Buscar fruta</h2>
      <input type="text" id="entrada-busca" placeholder="Ex: banana">
      <button id="btn-buscar" py-click="buscar">Buscar</button>
      <p id="mensagem-guardrail" class="mensagem"></p>
    </section>

    <!-- Telemetria -->
    <section class="card telemetria">
      <h2>Telemetria</h2>
      <ul id="telemetria"></ul>
    </section>

    <!-- Embeddings / Norma Euclidiana -->
    <section class="card vetores">
      <h2>Análise Vetorial (Norma Euclidiana)</h2>
      <div id="resultado-vetor"></div>
    </section>

    <!-- Catálogo -->
    <section class="card catalogo">
      <h2>Catálogo</h2>
      <div id="grade-frutas" class="grade"></div>
    </section>
  </main>

  <footer class="rodape">
    <p>CP3 · IA&amp;ML · FIAP</p>
  </footer>
</body>
</html>
